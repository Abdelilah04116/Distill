<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430"
     role="img" aria-labelledby="titre description">
  <title id="titre">Pipeline Distill</title>
  <desc id="description">task.yaml alimente le Generateur, qui passe au Critique, puis a l'Entrainement LoRA, puis a l'Evaluateur. Si la cible n'est pas atteinte, l'Ameliorateur produit des exemples cibles et renvoie au Critique, trois fois au maximum. Si elle est atteinte, le pipeline exporte en GGUF, Ollama et FastAPI.</desc>

  <style>
    :root { color-scheme: light dark; }
    .surface   { fill: #fcfcfb; }
    .box       { fill: #ffffff; stroke: #dcdbd4; }
    .box-start { fill: #ffffff; stroke: #94938b; }
    .box-end   { fill: #ffffff; stroke: #2a78d6; stroke-width: 2; }
    .decision  { fill: #ffffff; stroke: #eb6834; }
    .title     { fill: #0b0b0b; font-weight: 600; }
    .sub       { fill: #52514e; }
    .edge      { stroke: #94938b; fill: none; }
    .edge-loop { stroke: #eb6834; fill: none; }
    .lbl       { fill: #7a7873; }
    .lbl-loop  { fill: #eb6834; }
    .head      { fill: #94938b; }
    .head-loop { fill: #eb6834; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    @media (prefers-color-scheme: dark) {
      .surface   { fill: #1a1a19; }
      .box       { fill: #232321; stroke: #383835; }
      .box-start { fill: #232321; stroke: #6c6b64; }
      .box-end   { fill: #232321; stroke: #3987e5; }
      .decision  { fill: #232321; stroke: #d95926; }
      .title     { fill: #ffffff; }
      .sub       { fill: #c3c2b7; }
      .edge      { stroke: #6c6b64; }
      .edge-loop { stroke: #d95926; }
      .lbl       { fill: #94938b; }
      .lbl-loop  { fill: #d95926; }
      .head      { fill: #6c6b64; }
      .head-loop { fill: #d95926; }
    }
  </style>

  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
    <marker id="fleche-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-loop" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="surface" width="880" height="430" rx="12"/>

  <!-- rangee du haut : task.yaml -> generateur -> critique -> entrainement -->
  <g>
    <rect class="box-start" x="24" y="44" width="164" height="62" rx="8"/>
    <text class="title" x="106" y="70" text-anchor="middle" font-size="14">task.yaml</text>
    <text class="sub" x="106" y="90" text-anchor="middle" font-size="11">description + 20 seeds</text>

    <rect class="box" x="236" y="44" width="164" height="62" rx="8"/>
    <text class="title" x="318" y="70" text-anchor="middle" font-size="14">Générateur</text>
    <text class="sub" x="318" y="90" text-anchor="middle" font-size="11">2 à 5k exemples</text>

    <rect class="box" x="448" y="44" width="164" height="62" rx="8"/>
    <text class="title" x="530" y="70" text-anchor="middle" font-size="14">Critique</text>
    <text class="sub" x="530" y="90" text-anchor="middle" font-size="11">dédup + LLM juge</text>

    <rect class="box" x="660" y="44" width="180" height="62" rx="8"/>
    <text class="title" x="750" y="70" text-anchor="middle" font-size="14">Entraînement</text>
    <text class="sub" x="750" y="90" text-anchor="middle" font-size="11">LoRA · Unsloth</text>
  </g>

  <line class="edge" x1="188" y1="75" x2="228" y2="75" marker-end="url(#fleche)"/>
  <line class="edge" x1="400" y1="75" x2="440" y2="75" marker-end="url(#fleche)"/>
  <line class="edge" x1="612" y1="75" x2="652" y2="75" marker-end="url(#fleche)"/>

  <!-- descente vers l'evaluateur -->
  <path class="edge" d="M 750 106 L 750 196" marker-end="url(#fleche)"/>

  <!-- rangee du milieu : ameliorateur <- decision <- evaluateur -->
  <g>
    <rect class="box" x="660" y="200" width="180" height="62" rx="8"/>
    <text class="title" x="750" y="226" text-anchor="middle" font-size="14">Évaluateur</text>
    <text class="sub" x="750" y="246" text-anchor="middle" font-size="11">SLM vs professeur</text>

    <path class="decision" d="M 500 231 L 590 196 L 680 231 L 590 266 Z"/>
    <text class="title" x="590" y="236" text-anchor="middle" font-size="13">Cible atteinte ?</text>

    <rect class="box" x="236" y="200" width="180" height="62" rx="8"/>
    <text class="title" x="326" y="226" text-anchor="middle" font-size="14">Améliorateur</text>
    <text class="sub" x="326" y="246" text-anchor="middle" font-size="11">exemples ciblés sur les erreurs</text>
  </g>

  <line class="edge" x1="660" y1="231" x2="684" y2="231" marker-start="url(#fleche)"/>
  <line class="edge-loop" x1="500" y1="231" x2="424" y2="231" marker-end="url(#fleche-loop)"/>
  <text class="lbl-loop" x="462" y="222" text-anchor="middle" font-size="11">non</text>

  <!-- boucle : ameliorateur -> critique, max 3 iterations -->
  <path class="edge-loop" d="M 326 200 L 326 150 L 530 150 L 530 114" marker-end="url(#fleche-loop)"/>
  <text class="lbl-loop" x="428" y="142" text-anchor="middle" font-size="11">3 itérations maximum</text>

  <!-- sortie : export -->
  <path class="edge" d="M 590 266 L 590 326" marker-end="url(#fleche)"/>
  <text class="lbl" x="604" y="300" font-size="11">oui</text>

  <rect class="box-end" x="468" y="330" width="244" height="66" rx="8"/>
  <text class="title" x="590" y="357" text-anchor="middle" font-size="14">Export</text>
  <text class="sub" x="590" y="377" text-anchor="middle" font-size="11">GGUF · Ollama · FastAPI · rapport HTML</text>

  <!-- note : le professeur ne sert jamais en production -->
  <text class="lbl" x="24" y="356" font-size="11">Le gros LLM ne sert que pendant</text>
  <text class="lbl" x="24" y="372" font-size="11">la génération et l'évaluation,</text>
  <text class="lbl" x="24" y="388" font-size="11">jamais en production.</text>
</svg>
